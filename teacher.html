<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>老師設定單｜AI 眼鏡觀察課</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
  :root{
    --bg:#F4EEE8; --card:#FFFFFF; --tint:#EFE4D9; --line:#DFCDB9;
    --ink:#2B2722; --deep:#5B5146; --muted:#7A6F63;
    --green:#9CC96A; --green-deep:#75974F; --green-ink:#1F2E12;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#221E1A; --card:#2E2924; --tint:#3A332C; --line:#4A4138;
      --ink:#F1EAE2; --deep:#D8CDBF; --muted:#A99C8E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#221E1A; --card:#2E2924; --tint:#3A332C; --line:#4A4138;
    --ink:#F1EAE2; --deep:#D8CDBF; --muted:#A99C8E;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC',sans-serif;font-size:18px;line-height:1.5}
  header{padding:28px 24px 8px;max-width:1100px;margin:0 auto}
  h1{font-family:'Huninn','Noto Sans TC',sans-serif;font-weight:400;font-size:36px;letter-spacing:2px;margin:0 0 6px}
  .sub{color:var(--muted);margin:0}
  .presets{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .chip{border:2px solid var(--line);background:var(--card);color:var(--deep);border-radius:999px;padding:8px 18px;font-size:17px;font-weight:700;cursor:pointer}
  .chip:hover{border-color:var(--green)}
  main{max-width:1100px;margin:0 auto;padding:16px 24px 60px;display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}
  @media (max-width:820px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:20px 22px;margin-bottom:18px}
  .card h2{margin:0 0 12px;font-size:22px;display:flex;align-items:center;gap:10px}
  .num{width:34px;height:34px;border-radius:17px;background:var(--green);color:var(--green-ink);display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
  .hint{color:var(--muted);font-size:15px;margin:0 0 10px}
  input[type=text]{width:100%;height:52px;border:2px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;font-size:18px;color:var(--ink);background:var(--bg)}
  input[type=text]:focus{outline:none;border-color:var(--green)}
  .row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  .row input[type=text]{flex:1}
  select{height:52px;border:2px solid var(--line);border-radius:14px;padding:0 10px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg)}
  .del{width:44px;height:44px;border-radius:22px;border:2px solid var(--line);background:var(--card);color:var(--deep);font-size:22px;cursor:pointer;flex-shrink:0}
  .add{border:2px dashed var(--line);background:transparent;color:var(--deep);border-radius:14px;height:48px;width:100%;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
  .opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:16px;margin-bottom:8px;cursor:pointer}
  .opt:has(input:checked){border-color:var(--green);background:var(--tint)}
  .opt input{margin-top:5px;width:20px;height:20px;accent-color:var(--green-deep)}
  .opt b{display:block}
  .opt span{color:var(--muted);font-size:15px}
  .toggle{display:flex;gap:10px}
  .toggle label{flex:1;text-align:center;padding:12px;border:2px solid var(--line);border-radius:16px;cursor:pointer;font-weight:700}
  .toggle label:has(input:checked){border-color:var(--green);background:var(--tint)}
  .toggle input{display:none}
  /* 手機預覽 */
  .phone{position:sticky;top:16px}
  .phone .title{font-size:15px;color:var(--muted);margin:0 0 8px;text-align:center}
  .screen{width:100%;aspect-ratio:412/760;border-radius:34px;background:var(--bg);border:6px solid #3a3330;padding:18px 16px;overflow:hidden;display:flex;flex-direction:column;gap:10px}
  .s-title{font-family:'Huninn','Noto Sans TC',sans-serif;font-size:24px;letter-spacing:1px}
  .s-q{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:700;font-size:17px;min-height:48px}
  .s-photo{height:96px;border-radius:16px;background:var(--tint);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
  .s-table{background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden}
  .s-row{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:15px;align-items:center}
  .s-row:last-child{border-bottom:none}
  .s-row .k{width:84px;flex-shrink:0;font-weight:700;color:var(--deep)}
  .s-row .v{color:var(--muted)}
  .s-ai{font-size:13px;color:var(--muted);text-align:center}
  .s-btn{margin-top:auto;background:var(--green);color:var(--green-ink);border-radius:999px;text-align:center;padding:10px;font-family:'Huninn','Noto Sans TC',sans-serif;font-size:18px;box-shadow:0 4px 0 var(--green-deep)}
  .actions{display:flex;gap:10px;margin-top:8px}
  .btn{flex:1;height:56px;border-radius:999px;border:none;background:var(--green);color:var(--green-ink);font-family:'Huninn','Noto Sans TC',sans-serif;font-size:22px;letter-spacing:1px;cursor:pointer;box-shadow:0 5px 0 var(--green-deep)}
  .btn.sec{background:var(--card);color:var(--deep);border:2px solid var(--line);box-shadow:none}
  @media print{.presets,.actions,.phone .title{display:none}.screen{border-color:#999}}
</style>
</head>
<body>
<header>
  <h1>老師設定單</h1>
  <p class="sub">填完這四格，學生手機上的畫面就會長出來。兩位老師填的內容不同，但用的是同一個 App。</p>
  <div class="presets">
    <button class="chip" type="button" onclick="load('rock')">看岩石課範例</button>
    <button class="chip" type="button" onclick="load('plant')">看植物課範例</button>
    <button class="chip" type="button" onclick="load('blank')">清空自己填</button>
  </div>
</header>

<main>
  <div>
    <section class="card">
      <h2><span class="num">1</span>這堂課的題目</h2>
      <p class="hint">學生一進來會看到的一句話。</p>
      <input type="text" id="q" placeholder="例如：這顆石頭是什麼樣子？" oninput="render()">
    </section>

    <section class="card">
      <h2><span class="num">2</span>要觀察的面向</h2>
      <p class="hint">3～5 個。每一個會變成學生表格裡的一格，AI 也會照這個清單追問。</p>
      <div id="aspects"></div>
      <button class="add" type="button" onclick="addAspect()">＋ 再加一個</button>
    </section>

    <section class="card">
      <h2><span class="num">3</span>AI 可以暗示到什麼程度</h2>
      <label class="opt"><input type="radio" name="hint" value="0" onchange="render()"><div><b>只能追問，完全不暗示對錯</b><span>學生說什麼，AI 只會再問下一個問題。</span></div></label>
      <label class="opt"><input type="radio" name="hint" value="1" onchange="render()"><div><b>可以鼓勵方向，但不說對錯</b><span>例如「你注意到溫度了，很好，再摸摸看表面」。</span></div></label>
      <label class="opt"><input type="radio" name="hint" value="2" onchange="render()"><div><b>可以說「再想想」這種輕微提示</b><span>學生偏掉時，AI 會輕輕拉回來。</span></div></label>
    </section>

    <section class="card">
      <h2><span class="num">4</span>這堂課有沒有小組討論</h2>
      <p class="hint">有的話，學生個人送出後會多一顆「去小組討論」按鈕，組長可以彙整全組再交一次。</p>
      <div class="toggle">
        <label><input type="radio" name="group" value="0" onchange="render()">沒有，個人觀察就好</label>
        <label><input type="radio" name="group" value="1" onchange="render()">有小組討論</label>
      </div>
    </section>

    <div class="actions">
      <button class="btn sec" type="button" onclick="window.print()">列印這張</button>
      <button class="btn" type="button" onclick="copyText()">複製成文字</button>
    </div>
  </div>

  <aside class="phone">
    <p class="title">學生手機上會看到</p>
    <div class="screen">
      <div class="s-title">今天的任務</div>
      <div class="s-q" id="p-q">（還沒填題目）</div>
      <div class="s-photo">學生用眼鏡拍的照片</div>
      <div class="s-table" id="p-table"></div>
      <div class="s-ai" id="p-ai"></div>
      <div class="s-btn" id="p-btn">送出給老師</div>
    </div>
  </aside>
</main>

<script>
const PRESETS = {
  rock:  { q:'這顆石頭是什麼樣子？用你的手和眼睛仔細觀察。',
           aspects:[['顏色','text'],['摸起來','text'],['觸感','text'],['其他觀察','text']], hint:'1', group:'1' },
  plant: { q:'這棵植物住在什麼樣的地方？它需要什麼才能長大？',
           aspects:[['葉子的樣子','text'],['陽光','choice'],['土乾或濕','choice'],['我查到怎麼種','text'],['我的猜想','text']], hint:'1', group:'0' },
  blank: { q:'', aspects:[['',''],['',''],['','']], hint:'', group:'' }
};
const TYPES = {'':'選類型', photo:'拍照', choice:'選一個', text:'短文字'};
const HINT_TXT = ['AI 只會一直問，不說對錯', 'AI 會鼓勵你，但不說答案', 'AI 偏掉時會說「再想想」'];

function aspectRow(name='', type=''){
  const d = document.createElement('div'); d.className='row';
  d.innerHTML = `<input type="text" placeholder="例如：顏色" value="${name}" oninput="render()">
    <select onchange="render()">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===type?'selected':''}>${v}</option>`).join('')}</select>
    <button class="del" type="button" aria-label="刪除" onclick="this.parentNode.remove();render()">×</button>`;
  return d;
}
function addAspect(){ const box=document.getElementById('aspects'); if(box.children.length>=5){alert('最多 5 個，太多學生記不住');return;} box.appendChild(aspectRow()); render(); }
function load(k){
  const p = PRESETS[k]; document.getElementById('q').value = p.q;
  const box=document.getElementById('aspects'); box.innerHTML=''; p.aspects.forEach(([n,t])=>box.appendChild(aspectRow(n,t)));
  document.querySelectorAll('input[name=hint]').forEach(r=>r.checked = r.value===p.hint);
  document.querySelectorAll('input[name=group]').forEach(r=>r.checked = r.value===p.group);
  render();
}
function state(){
  const aspects=[...document.querySelectorAll('#aspects .row')].map(r=>({name:r.querySelector('input').value.trim(), type:r.querySelector('select').value})).filter(a=>a.name);
  const hint=(document.querySelector('input[name=hint]:checked')||{}).value ?? '';
  const group=(document.querySelector('input[name=group]:checked')||{}).value ?? '';
  return { q:document.getElementById('q').value.trim(), aspects, hint, group };
}
function render(){
  const s=state();
  document.getElementById('p-q').textContent = s.q || '（還沒填題目）';
  const t=document.getElementById('p-table');
  t.innerHTML = s.aspects.length ? s.aspects.map(a=>`<div class="s-row"><span class="k">${a.name}</span><span class="v">${a.type==='choice'?'選一個 ▾':a.type==='photo'?'拍一張':'學生填'}</span></div>`).join('') : '<div class="s-row"><span class="v">（還沒有觀察面向）</span></div>';
  document.getElementById('p-ai').textContent = s.hint!=='' ? HINT_TXT[+s.hint] : '';
  document.getElementById('p-btn').textContent = s.group==='1' ? '送出，然後去小組討論' : '送出給老師';
  try{ localStorage.setItem('teacher-setup', JSON.stringify(s)); }catch(e){}
}
function copyText(){
  const s=state();
  const txt = `【老師設定單】\n題目：${s.q}\n觀察面向：${s.aspects.map(a=>`${a.name}（${TYPES[a.type]||'短文字'}）`).join('、')}\nAI 暗示程度：${s.hint!==''?HINT_TXT[+s.hint]:'未選'}\n小組討論：${s.group==='1'?'有':s.group==='0'?'沒有':'未選'}`;
  navigator.clipboard?.writeText(txt).then(()=>alert('已複製，可以貼到訊息或表單裡')).catch(()=>prompt('複製這段：',txt));
}
(function init(){
  let saved=null; try{ saved=JSON.parse(localStorage.getItem('teacher-setup')||'null'); }catch(e){}
  if(saved && (saved.q || saved.aspects?.length)){
    document.getElementById('q').value=saved.q||'';
    const box=document.getElementById('aspects'); (saved.aspects||[]).forEach(a=>box.appendChild(aspectRow(a.name,a.type)));
    if(!box.children.length) box.appendChild(aspectRow());
    document.querySelectorAll('input[name=hint]').forEach(r=>r.checked=r.value===saved.hint);
    document.querySelectorAll('input[name=group]').forEach(r=>r.checked=r.value===saved.group);
    render();
  } else { load('rock'); }
})();
</script>
</body>
</html>
